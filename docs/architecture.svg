<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1E3A5F"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">Domina App — Clean Architecture + BLoC</text>

  <!-- Presentation -->
  <rect x="40" y="55" width="680" height="130" rx="10" fill="#E8F0FA" stroke="#1E3A5F"/>
  <text x="60" y="80" font-weight="bold" fill="#1E3A5F">Presentation</text>
  <rect x="60" y="95" width="190" height="70" rx="6" fill="#fff" stroke="#1E3A5F"/>
  <text x="155" y="125" text-anchor="middle">Pages / Widgets</text>
  <text x="155" y="146" text-anchor="middle" font-size="12" fill="#555">Screens per user role</text>
  <rect x="285" y="95" width="190" height="70" rx="6" fill="#fff" stroke="#1E3A5F"/>
  <text x="380" y="125" text-anchor="middle">BLoC (Events/States)</text>
  <text x="380" y="146" text-anchor="middle" font-size="12" fill="#555">State management</text>
  <rect x="510" y="95" width="190" height="70" rx="6" fill="#fff" stroke="#1E3A5F"/>
  <text x="605" y="125" text-anchor="middle">Resources / uniti</text>
  <text x="605" y="146" text-anchor="middle" font-size="12" fill="#555">Routes, Theme, Shared widgets</text>
  <line x1="250" y1="130" x2="285" y2="130" stroke="#1E3A5F" marker-end="url(#a)"/>

  <!-- Domain -->
  <rect x="40" y="225" width="680" height="130" rx="10" fill="#EAF6EC" stroke="#2E7D32"/>
  <text x="60" y="250" font-weight="bold" fill="#2E7D32">Domain (pure Dart)</text>
  <rect x="60" y="265" width="190" height="70" rx="6" fill="#fff" stroke="#2E7D32"/>
  <text x="155" y="295" text-anchor="middle">UseCases (~100)</text>
  <text x="155" y="316" text-anchor="middle" font-size="12" fill="#555">Either&lt;Failure, T&gt;</text>
  <rect x="285" y="265" width="190" height="70" rx="6" fill="#fff" stroke="#2E7D32"/>
  <text x="380" y="295" text-anchor="middle">Repository interfaces</text>
  <text x="380" y="316" text-anchor="middle" font-size="12" fill="#555">remote + SQL</text>
  <rect x="510" y="265" width="190" height="70" rx="6" fill="#fff" stroke="#2E7D32"/>
  <text x="605" y="295" text-anchor="middle">Models / Failure</text>
  <text x="605" y="316" text-anchor="middle" font-size="12" fill="#555">Business entities</text>
  <line x1="250" y1="300" x2="285" y2="300" stroke="#2E7D32" marker-end="url(#a)"/>

  <!-- Data -->
  <rect x="40" y="395" width="680" height="130" rx="10" fill="#FFF4E5" stroke="#E65100"/>
  <text x="60" y="420" font-weight="bold" fill="#E65100">Data</text>
  <rect x="60" y="435" width="190" height="70" rx="6" fill="#fff" stroke="#E65100"/>
  <text x="155" y="465" text-anchor="middle">Repository impls</text>
  <text x="155" y="486" text-anchor="middle" font-size="12" fill="#555">+ Mappers</text>
  <rect x="285" y="435" width="190" height="70" rx="6" fill="#fff" stroke="#E65100"/>
  <text x="380" y="465" text-anchor="middle">Remote: Dio + Retrofit</text>
  <text x="380" y="486" text-anchor="middle" font-size="12" fill="#555">REST client</text>
  <rect x="510" y="435" width="190" height="70" rx="6" fill="#fff" stroke="#E65100"/>
  <text x="605" y="465" text-anchor="middle">Local: SQLCipher</text>
  <text x="605" y="486" text-anchor="middle" font-size="12" fill="#555">Local database</text>

  <!-- vertical flow -->
  <line x1="380" y1="185" x2="380" y2="225" stroke="#1E3A5F" stroke-width="2" marker-end="url(#a)"/>
  <text x="392" y="210" font-size="12" fill="#555">calls UseCases</text>
  <line x1="380" y1="395" x2="380" y2="355" stroke="#E65100" stroke-width="2" marker-end="url(#a)"/>
  <text x="392" y="380" font-size="12" fill="#555">implements interfaces</text>

  <!-- External -->
  <rect x="285" y="565" width="190" height="50" rx="6" fill="#F3F3F3" stroke="#666"/>
  <text x="380" y="595" text-anchor="middle">Remote REST API</text>
  <rect x="510" y="565" width="190" height="50" rx="6" fill="#F3F3F3" stroke="#666"/>
  <text x="605" y="595" text-anchor="middle">Secure Storage</text>
  <rect x="60" y="565" width="190" height="50" rx="6" fill="#F3F3F3" stroke="#666"/>
  <text x="155" y="595" text-anchor="middle">Firebase (Crashlytics/Analytics)</text>
  <line x1="380" y1="505" x2="380" y2="565" stroke="#666" marker-end="url(#a)"/>
  <line x1="605" y1="505" x2="605" y2="565" stroke="#666" marker-end="url(#a)"/>
</svg>
